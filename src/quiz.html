<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <main class="filter">

    <main id="main">

    </main>
    <h1 class="title">Quiz</h1>
    <div class="quiz-container">
        
        <div id="quiz-screen">
            <div class="header">
                <span id="question-number"></span>
                <span id="timer-display" class="timer">Tempo: 20s</span>
            </div>
            <h2 id="question-text">Carregando pergunta...</h2>
            <div id="options-container" class="options-list"></div>
        </div>

        
        <div id="result-screen" class="hide score-screen">
            <h2>Quiz Finalizado!</h2>
            <p id="final-score">Você acertou 0 de 0 perguntas.</p>
            <button class="option-btn" style="text-align:center;" onclick="location.reload()">Refazer Quiz</button>
        </div>
    </div>
    <div id="popup">
    </div>
    </main>
    <script type="module" src="../dist/script.js" defer></script>
</body>
</html>
